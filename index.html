<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/scripts.js" defer></script>
    <title>Box-Shadow Generator</title>
</head>

<body>
    <div id="container">
        <div id="main-container">
            <div id="settings-container">
                <h1>Box Shadow Settings</h1>
                <div class="input-field">
                    <div class="range">
                        <label for="horizontal">Horizontal offset</label>
                        <input type="range" name="horizontal" id="horizontal" min="-100" max="100" value="5">
                    </div>
                    <div class="reference-input">
                        <input type="number" name="horizontal-value" id="horizontal-value">
                        <span>px</span>
                    </div>
                </div>
                <div class="input-field">
                    <div class="range">
                        <label for="vertical">Vertical offset</label>
                        <input type="range" name="vertical" id="vertical" min="-100" max="100" value="5">
                    </div>
                    <div class="reference-input">
                        <input type="number" name="vertical-value" id="vertical-value">
                        <span>px</span>
                    </div>
                </div>
                <div class="input-field">
                    <div class="range">
                        <label for="blur">Blur</label>
                        <input type="range" name="blur" id="blur" min="0" max="100" value="10">
                    </div>
                    <div class="reference-input">
                        <input type="number" name="blur-value" id="blur-value">
                        <span>px</span>
                    </div>
                </div>
                <div class="input-field">
                    <div class="range">
                        <label for="spread">Spread</label>
                        <input type="range" name="spread" id="spread" min="-100" max="100" value="3">
                    </div>
                    <div class="reference-input">
                        <input type="number" name="spread-value" id="spread-value">
                        <span>px</span>
                    </div>
                </div>
                <div class="input-field">
                    <div class="color-input">
                        <label for="color">Color</label>
                        <input type="color" name="color" id="color" value="#000000">
                    </div>
                    <div class="color-reference-input">
                        <input type="text" name="color-value" id="color-value">
                    </div>
                </div>
                <div class="input-field">
                    <div class="range">
                        <label for="opacity">Opacity</label>
                        <input type="range" name="opacity" id="opacity" value="1" min="0" max="1" step="0.01">
                    </div>
                    <div class="reference-input">
                        <input type="number" name="opacity-value" id="opacity-value">
                        <span>%</span>
                    </div>
                </div>
                <div class="input-field">
                    <div class="inner-shadow-input">
                        <label for="inner-shadow">Inner shadow?</label>
                        <input type="checkbox" name="inner-shadow" id="inner-shadow">
                    </div>
                </div>
            </div>
            <div id="preview-container">
                <h1>Effect preview:</h1>
                <div id="preview">
                </div>
            </div>
        </div>
        <div id="rules-container">
            <h2>Click below to copy your rules:</h2>
            <div id="rules-field">
                <p id="rule">box-shadow<span></span></p>
                <p id="webkit-rule">-webkit-box-shadow<span></span></p>
                <p id="moz-rule">-moz-box-shadow<span></span></p>
            </div>
        </div>
    </div>
</body>

</html>
